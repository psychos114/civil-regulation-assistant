name: Initialize vector database

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-version
    paths:
      - .github/workflows/initialize-vector-store.yml
      - lib/vector-store.ts
      - lib/chat.ts
      - drizzle/**

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build and verify Pinecone vector database
        shell: bash
        run: |
          endpoint="https://civil-regulation-assistant-11462.mexvafdfvhuhb.chatgpt.site/api/rag/vector-store"
          for attempt in {1..20}; do
            response="$(curl --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "$endpoint")"
            echo "$response"
            if grep -q '"ready":true' <<<"$response"; then
              echo "Pinecone vector database is ready."
              status_response="$(curl --silent --show-error \
                "$endpoint")"
              if ! grep -q '"ready":true' <<<"$status_response"; then
                echo "Vector status verification failed."
                exit 1
              fi

              chat_response="$(curl --silent --show-error \
                --request POST \
                --header 'Content-Type: application/json' \
                --data '{"question":"中国建筑的主要业务有哪些？","history":[]}' \
                "https://civil-regulation-assistant-11462.mexvafdfvhuhb.chatgpt.site/api/chat")"
              if grep -q '"success":true' <<<"$chat_response" && \
                 grep -q '"mode":"vector"' <<<"$chat_response"; then
                echo "Pinecone retrieval and model answer verification passed."
                exit 0
              fi
              echo "Chat verification failed."
              exit 1
            fi
            sleep 5
          done
          echo "Vector Store did not become ready before the timeout."
          exit 1
